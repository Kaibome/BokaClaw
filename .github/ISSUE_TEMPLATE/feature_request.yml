name: Feature Request
description: Suggest a new feature or improvement for BokaClaw
labels: ["enhancement"]

body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of BokaClaw does this relate to?
      options:
        - Server / REST API
        - Agent runtime
        - Dashboard
        - Memory
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      value: |
        ### Use Case

        What problem are you trying to solve?

        ### Proposed Solution

        How should this work? Include API examples or pseudocode if helpful.

        ### Alternatives Considered

        Any workarounds you've tried or other approaches considered.
    validations:
      required: true

  - type: dropdown
    id: ai_assistance
    attributes:
      label: AI Assistance
      description: >-
        This asks where the idea came from, not how the text was written.
        Drafting the write-up with AI is fine. A request you hit yourself while
        building something carries more weight than one a model suggested.
      options:
        - No AI involved, this is a need I hit myself
        - AI-assisted, but the need is mine
        - AI suggested this feature
    validations:
      required: true
