name: Server CI

# FastAPI server, memory backend, and cross-package product tests.
# On PRs this is invoked by ci-gate.yml (the single required check);
# push-to-main and manual runs remain standalone.
on:
  workflow_call:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'agent-loop/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Makefile'
      - '.github/workflows/server-checks.yml'

permissions:
  contents: read

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      APP_DB_NAME: mem0_app
      JWT_SECRET: test-jwt-secret
      AUTH_DISABLED: "false"
      ADMIN_API_KEY: test-admin-key-1234567890
      OPENAI_API_KEY: test-key
      PYTHONPATH: ${{ github.workspace }}/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install "./agent-loop[postgres]"
          pip install pytest pytest-mock pytest-asyncio ruff

      - name: Create application database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mem0_app'

      - name: Apply migrations
        working-directory: server
        run: alembic upgrade head

      - name: Ruff
        run: ruff check server/app server/tests tests agent-loop/src agent-loop/tests

      - name: Pytest
        run: pytest server/tests tests -q
