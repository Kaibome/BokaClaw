server:
  - changed-files:
      - any-glob-to-any-file:
          - 'server/**'
          - 'tests/**'

agent-runtime:
  - changed-files:
      - any-glob-to-any-file:
          - 'agent-loop/**'

dashboard:
  - changed-files:
      - any-glob-to-any-file:
          - 'dashboard/**'

memory:
  - changed-files:
      - any-glob-to-any-file:
          - 'server/app/memory/**'
          - 'server/alembic/versions/**'
          - 'docs/memory/**'
          - 'server/scripts/migrate_mem0_to_workspace_memory.py'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'scripts/**'
          - '.pre-commit-config.yaml'
          - 'Makefile'
          - 'pyproject.toml'
