repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: ruff check
        language: system
        types: [python]
        # --force-exclude keeps the vendored deepeval source (excluded in
        # pyproject.toml) out of the run even though pre-commit passes the
        # staged file paths explicitly.
        args: [--fix, --force-exclude]

      - id: isort
        name: isort
        entry: isort
        language: system
        types: [python]
        args: ["--profile", "black"]
