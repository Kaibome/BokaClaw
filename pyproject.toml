# Repository-wide tooling configuration.
#
# BokaClaw ships three packages, each with its own build/test entry point:
#   - server/      FastAPI service (server/requirements.txt, docker compose)
#   - agent-loop/  bokaclaw-agent Python SDK (agent-loop/pyproject.toml, hatch)
#   - dashboard/   Next.js console (dashboard/package.json, pnpm)
#
# This file only holds shared linter settings; it is not a distributable package.

[tool.ruff]
line-length = 120
extend-exclude = ["deepeval"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# B008: FastAPI dependency injection is expressed as a call in a default argument.
# B904: handlers intentionally translate backend failures into HTTP errors.
ignore = ["B008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["app", "bokaclaw_agent"]

[tool.isort]
profile = "black"
known_first_party = ["app", "bokaclaw_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
