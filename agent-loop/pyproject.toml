[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bokaclaw-agent"
version = "0.1.0"
description = "Minimal ReAct agent runtime with pluggable models and Postgres session persistence."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "Apache-2.0"
authors = [{ name = "BokaClaw" }]
keywords = ["agent", "react", "tool-calling", "llm", "postgres"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7.3,<3.0",
    "openai>=1.40,<3.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2.8,<4.0",
    "psycopg-pool>=3.2.6,<4.0",
]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-mock>=3.12",
]
dev = ["hatch", "ruff>=0.16,<1.0", "isort>=5.13"]

[project.urls]
Homepage = "https://github.com/BokaClaw/BokaClaw/tree/main/agent-loop"
Repository = "https://github.com/BokaClaw/BokaClaw"

[tool.hatch.build.targets.wheel]
packages = ["src/bokaclaw_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "pyproject.toml"]

[tool.hatch.envs.default]
features = ["postgres", "test"]
dependencies = [
    "ruff>=0.16,<1.0",
    "isort>=5.13",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
lint = "ruff check src tests examples"
format = "ruff format src tests examples"
format-check = "ruff format --check src tests examples"
typecheck = "python -m compileall -q src"

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["bokaclaw_agent"]

[tool.isort]
profile = "black"
known_first_party = ["bokaclaw_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
markers = [
    "integration: tests that require a live Postgres database",
]
